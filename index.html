<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Di default il tema segue il sistema (gestito via CSS, prefers-color-scheme):
      // qui pre-impostiamo l'attributo solo se l'utente ha scelto esplicitamente un tema
      // in passato, prima del primo paint, così non c'è flash del tema sbagliato.
      try {
        var scelta = localStorage.getItem('theme')
        if (scelta === 'light' || scelta === 'dark') {
          document.documentElement.setAttribute('data-theme', scelta)
        }
      } catch (e) {}

      // Lingua: di default segue il dispositivo; una scelta esplicita salvata vince. La
      // impostiamo su <html lang> prima del paint per screen reader e crawler (React poi
      // riallinea lo stesso attributo, vedi src/i18n/useLanguage.ts).
      try {
        var lang = localStorage.getItem('lang')
        if (lang !== 'it' && lang !== 'en') {
          var lingue = navigator.languages || [navigator.language || 'en']
          lang = lingue.some(function (l) {
            return l && l.toLowerCase().indexOf('it') === 0
          })
            ? 'it'
            : 'en'
        }
        document.documentElement.setAttribute('lang', lang)
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;600;700;800&display=swap"
      rel="stylesheet"
