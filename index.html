<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Di default il tema segue il sistema (gestito via CSS, prefers-color-scheme):
      // qui pre-impostiamo l'attributo solo se l'utente ha scelto esplicitamente un tema
      // in passato, prima del primo paint, così non c'è flash del tema sbagliato.
      try {
        var scelta = localStorage.getItem('theme')
        if (scelta === 'light' || scelta === 'dark') {
          document.documentElement.setAttribute('data-theme', scelta)
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calcolatore trasparente della retribuzione netta da RAL lorda, con il percorso di calcolo passo per passo."
    />
    <title>Assignment - Gabriele x JetHR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
